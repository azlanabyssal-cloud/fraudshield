name: OpenSSF Scorecard
# Scores the repository's own supply-chain practices (pinned actions, token permissions, branch protection, dependency updates, security policy) and posts
# the findings to the Security tab, so a regression in how the project is run is as visible as a failing test.
on:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * 1'
  push:
    branches: [master]
permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@9f759ee644a3e7c15c1390abf49868036c00067b # v3.38.3
        with:
          sarif_file: results.sarif
