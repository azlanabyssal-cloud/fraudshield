name: Deploy site
# Publishes exactly what scripts/assemble_site.js assembles (an allowlist: no tests, no data tools, no schema) to GitHub Pages, then checks the live site.
# It runs by hand. While the repository's Pages source is "Deploy from a branch" this workflow changes nothing; switching Settings > Pages > Source to
# "GitHub Actions" is the cutover, and rolling back is the same switch, or running this workflow on an earlier tag.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or tag to publish (a tag to roll back)'
        required: false
        default: 'master'
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run check
      - name: Assemble
        run: node scripts/assemble_site.js --out _site
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  verify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: The deployed site answers, with the service worker at the version just built
        run: |
          CACHE=$(grep -o "fraudshield-v[0-9]*" sw.js | head -1)
          node scripts/smoke_live.js "https://azlanabyssal-cloud.github.io/fraudshield/" --expect-cache "$CACHE"
