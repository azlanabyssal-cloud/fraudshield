name: CI
on:
  pull_request:
  push:
    branches: [master]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - name: Release gate (reports NO_EVIDENCE until the S0 dataset exists)
        run: node mlops/run.js
      - name: Syntax check browser scripts
        run: |
          node --check script.js
          node --check sw.js
          node --check lib/core.js
