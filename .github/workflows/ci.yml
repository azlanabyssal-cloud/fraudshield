name: CI
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run lint
      - name: Pages match the data files (nothing statistical typed by hand, no stale generated region)
        run: npm run site:check
      - name: Motion tokens match the spring solver
        run: npm run motion:check
      - name: Model lineage (the shipped model, its data digests, trainer and feature code match the record)
        run: npm run model:lineage:check
      - run: npm test
      - name: Web app (TypeScript, strict mode with indexed access checked)
        run: npm run web:typecheck
      - name: Web app tests (differential parity with the shipped code, interface behaviour, accessibility audit, voice)
        run: npm run web:test
      - name: Web app build, then the policy, same-origin and size-budget gate
        run: npm run web:budget
      - name: Web app in a real Chrome (axe with colour contrast, light and dark, phone and desktop; console and policy errors; touch targets; keyboard)
        run: npm run audit:web
      - name: Syntax check browser scripts
        run: |
          node --check script.js
          node --check sw.js
          node --check lib/core.js
          node --check lib/river.js
          node --check lib/flow.js

  # The release gate exits 1 whenever there is no evidence, which is true until the S0 dataset exists.
  # It runs as its own job so that state is visible without hiding test results. To make it blocking,
  # delete the next line and require this job in branch protection.
  release-gate:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm ci
      - run: node mlops/run.js
