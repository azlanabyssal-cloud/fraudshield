name: Live site check
# Every morning, and on demand: do the pages, their scripts, styles, images, fonts, the manifest, the service worker, the model file and the video (with range
# requests) all answer on the live site? A failure sends the usual Actions failure e-mail to the owner of the repository.
on:
  workflow_dispatch:
  schedule:
    - cron: '41 2 * * *'
permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: node scripts/smoke_live.js "https://azlanabyssal-cloud.github.io/fraudshield/"
